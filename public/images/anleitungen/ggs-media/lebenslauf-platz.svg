<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
  <title>Lebenslauf eines Platzes (Seat) in GGS Media</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="920" height="400" rx="14" fill="#ffffff"/>
  <!-- boxes -->
  <g stroke-width="2">
    <rect x="40" y="150" width="190" height="84" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
    <rect x="420" y="40" width="190" height="84" rx="12" fill="#ecfdf5" stroke="#10b981"/>
    <rect x="710" y="40" width="190" height="84" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="420" y="270" width="190" height="84" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  </g>
  <g font-weight="700" font-size="16" text-anchor="middle" fill="#0f172a">
    <text x="135" y="185">Reserviert</text>
    <text x="515" y="75">Eingelöst</text>
    <text x="805" y="75">Abgelaufen</text>
    <text x="515" y="305">Zurückgeholt</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#475569">
    <text x="135" y="206">Platz im Pool blockiert,</text>
    <text x="135" y="222">noch kein Code</text>
    <text x="515" y="96">Code angezeigt und</text>
    <text x="515" y="112">fest zugeteilt – endgültig</text>
    <text x="805" y="96">Laufzeit vorbei, Code</text>
    <text x="805" y="112">bleibt verbraucht</text>
    <text x="515" y="326">Platz geht zurück</text>
    <text x="515" y="342">in den Pool</text>
  </g>
  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M230 170 C 300 110, 360 86, 418 84"/>
    <path d="M610 82 L 708 82"/>
    <path d="M230 214 C 300 270, 360 310, 418 312"/>
    <path d="M420 340 C 260 370, 130 330, 122 238" stroke-dasharray="6 5"/>
  </g>
  <g font-size="12.5" fill="#0f172a">
    <text x="190" y="96" font-weight="600">Code abrufen</text>
    <text x="620" y="140" font-weight="600">Stichtag</text>
    <text x="620" y="156" fill="#475569">(nur Schuljahres-Plätze)</text>
    <text x="625" y="286" font-weight="600">nicht abgerufen und …</text>
    <text x="625" y="306">• Rückholfrist vorbei</text>
    <text x="625" y="324">• Stichtag erreicht</text>
    <text x="625" y="342">• von Hand zurückgeholt</text>
    <text x="30" y="380" fill="#475569">„Neu anfordern“ oder der nächtliche Regel-Abgleich legen einen neuen Platz an</text>
  </g>
  <text x="30" y="30" font-size="12" fill="#64748b">Dauerhafte Plätze haben keinen Stichtag und laufen nie ab.</text>
</svg>
