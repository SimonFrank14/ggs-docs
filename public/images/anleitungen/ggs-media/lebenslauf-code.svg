<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
  <title>Status eines Lizenzcodes in GGS Media</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="880" height="360" rx="14" fill="#ffffff"/>
  <g stroke-width="2">
    <rect x="40" y="140" width="170" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="355" y="40" width="170" height="76" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
    <rect x="670" y="140" width="170" height="76" rx="12" fill="#ecfdf5" stroke="#10b981"/>
    <rect x="355" y="250" width="170" height="76" rx="12" fill="#fef2f2" stroke="#ef4444"/>
    <rect x="40" y="265" width="170" height="60" rx="12" fill="#f1f5f9" stroke="#64748b"/>
  </g>
  <g font-weight="700" font-size="16" text-anchor="middle" fill="#0f172a">
    <text x="125" y="172">Frei</text>
    <text x="440" y="72">Reserviert</text>
    <text x="755" y="172">Eingelöst</text>
    <text x="440" y="282">Gesperrt</text>
    <text x="125" y="292">Abgelaufen</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#475569">
    <text x="125" y="193">im Pool</text>
    <text x="440" y="93">nur personengebundene</text>
    <text x="440" y="108">Codes (Anton)</text>
    <text x="755" y="193">nie wieder vergeben</text>
    <text x="440" y="303">defekt oder von Hand</text>
    <text x="440" y="318">aus dem Verkehr</text>
    <text x="125" y="311">Verlagsablauf der Charge</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M210 178 L 668 178"/>
    <path d="M190 140 C 230 80, 300 70, 353 74"/>
