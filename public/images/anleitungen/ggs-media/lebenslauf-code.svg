    <path d="M210 205 C 280 250, 320 280, 353 285"/>
    <path d="M755 216 C 740 280, 620 292, 527 290"/>
    <path d="M125 216 L 125 263"/>
  </g>
  <g font-size="12.5" fill="#0f172a" font-weight="600">
    <text x="360" y="170">Abruf in „Meine Lizenzen“</text>
    <text x="200" y="92">CSV-Import</text>
    <text x="620" y="96">Abruf</text>
    <text x="228" y="318">„sperren“</text>
    <text x="228" y="334" font-weight="400" fill="#475569">(„freigeben“ zurück)</text>
    <text x="610" y="252">„Code defekt“</text>
    <text x="135" y="245">Nachtlauf</text>
  </g>
