services:
  ggs-docs:
    image: ghcr.io/simonfrank14/ggs-docs:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Outstatic, Werte siehe .env.example
      - OST_GITHUB_ID=${OST_GITHUB_ID}
      - OST_GITHUB_SECRET=${OST_GITHUB_SECRET}
      - OST_TOKEN_SECRET=${OST_TOKEN_SECRET}
      - OST_REPO_OWNER=${OST_REPO_OWNER:-SimonFrank14}
      - OST_REPO_SLUG=${OST_REPO_SLUG:-ggs-docs}
      - OST_REPO_BRANCH=${OST_REPO_BRANCH:-main}
      - OST_CONTENT_PATH=${OST_CONTENT_PATH:-content/docs}
      - OST_REPO_MEDIA_PATH=${OST_REPO_MEDIA_PATH:-public/images/}
      - OST_PUBLIC_MEDIA_PATH=${OST_PUBLIC_MEDIA_PATH:-/images/}
      # Anmeldung im Portal, Werte siehe .env.example
      - AUTH_SECRET=${AUTH_SECRET}
      - WORDPRESS_OAUTH_CLIENT_ID=${WORDPRESS_OAUTH_CLIENT_ID}
      - WORDPRESS_OAUTH_CLIENT_SECRET=${WORDPRESS_OAUTH_CLIENT_SECRET}
      - WORDPRESS_OAUTH_BASE_URL=${WORDPRESS_OAUTH_BASE_URL:-https://goethe-gymnasium-stolberg.de}
      - WORDPRESS_APP_SECRET=${WORDPRESS_APP_SECRET}
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      # Eigene Origin, Phase 1–3 (Doku-Spec §5.1); zum Cutover auf docs.
      - "traefik.http.routers.ggs-docs.rule=Host(`${DOCS_HOST:-docs-neu.goethe-gymnasium-stolberg.de}`)"
      - "traefik.http.routers.ggs-docs.entrypoints=websecure"
      - "traefik.http.routers.ggs-docs.tls.certresolver=letsencrypt"
      - "traefik.http.services.ggs-docs.loadbalancer.server.port=3000"

networks:
  proxy-network:
    external: true
